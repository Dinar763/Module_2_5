plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'Module_2_5'

ext {
    springBootVersion = '3.5.6'
    springDependencyManagementVersion = '1.1.7'

    mysqlVersion = '8.0.33'
    flywayVersion = '10.0.0'

    jjwtVersion = '0.11.5'

    awsSdkVersion = '2.20.0'

    lombokVersion = '1.18.30'

    junitVersion = '5.10.0'
    mockitoVersion = '5.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0"

    implementation "org.flywaydb:flyway-core:$flywayVersion"
    implementation "org.flywaydb:flyway-mysql:$flywayVersion"
    runtimeOnly "com.mysql:mysql-connector-j:$mysqlVersion"
    implementation("io.projectreactor:reactor-core")

    implementation "io.jsonwebtoken:jjwt-api:$jjwtVersion"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:$jjwtVersion"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:$jjwtVersion"

    implementation "io.minio:minio:8.5.7"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"

    implementation platform('org.testcontainers:testcontainers-bom:1.19.8')

    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:junit-jupiter'

    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()

    systemProperties = [
            'DOCKER_HOST': 'tcp://localhost:2375',
            'docker.host': 'tcp://localhost:2375',
            'docker.tls.verify': 'false',
            'testcontainers.reuse.enable': 'true'
    ]

    jvmArgs = [
            '-XX:+EnableDynamicAgentLoading',
            '-Dspring.profiles.active=test'
    ]

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.register('cleanTestContainers', Exec) {
    commandLine 'docker', 'ps', '-aq', '--filter', 'name=testcontainers-*'
    standardOutput = new ByteArrayOutputStream()
    doLast {
        def containerIds = standardOutput.toString().trim()
        if (containerIds) {
            exec {
                commandLine 'docker', 'rm', '-f', *containerIds.split('\n')
            }
        }
    }
}

test.finalizedBy cleanTestContainers